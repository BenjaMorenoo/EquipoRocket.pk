server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve the file if it exists, otherwise return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward all /api/* requests to the gateway container on the Docker network.
    # VITE_API_URL is built as "" so axios uses relative paths — this proxy resolves them.
    location /api/ {
        proxy_pass         http://ms_gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
