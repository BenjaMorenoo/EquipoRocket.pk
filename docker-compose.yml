version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - equiporocket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Initialization Service
  ms_db:
    build:
      context: ./ms_db
      dockerfile: Dockerfile
    container_name: ms_db
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: example
      DB_NAME: equiporocketDb
      PORT: 4002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4002:4002"
    networks:
      - equiporocket-net

  # Authentication Microservice
  ms_auth:
    build:
      context: ./ms_auth
      dockerfile: Dockerfile
    container_name: ms_auth
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=equiporocketDb
      - DB_USER=postgres
      - DB_PASSWORD=example
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # Users Microservice
  ms_usuarios:
    build:
      context: ./ms_usuarios
      dockerfile: Dockerfile
    container_name: ms_usuarios
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=equiporocketDb
      - DB_USER=postgres
      - DB_PASSWORD=example
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # Pokemon Microservice
  ms_pokemon:
    build:
      context: ./ms_pokemon
      dockerfile: Dockerfile
    container_name: ms_pokemon
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=example
      - DB_NAME=equiporocketDb
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # Data Loading Microservice
  ms_carga_api:
    build:
      context: ./ms_carga_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: example
      DB_NAME: equiporocketDb
      API_URL: https://www.pikalytics.com/api/p/2026-04/gen9championsvgc2026regma-1760/
      PORT: 8000
    command: bash -c 'until bash -c "cat < /dev/tcp/postgres/5432 >/dev/null 2>&1"; do echo "Waiting for Postgres..."; sleep 1; done; uvicorn main:app --host 0.0.0.0 --port 8000'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # Monte Carlo Simulation Microservice
  ms_montecarlo:
    build:
      context: ./ms_montecarlo
      dockerfile: Dockerfile
    container_name: ms_montecarlo
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: equiporocketDb
      PGUSER: postgres
      PGPASSWORD: example
      MONTECARLO_API_URL: http://ms_carga_api:8000/api/pool
      PORT: 8010
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # Attendance Tracking Microservice
  ms_asistencia:
    build:
      context: ./ms_asistencia
      dockerfile: Dockerfile
    container_name: ms_asistencia
    image: ms_asistencia:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: example
      DB_NAME: equiporocketDb
      PORT: 8005
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equiporocket-net

  # API Gateway
  api_gateway:
    build:
      context: ./ms_gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      - PORT=8000
      - MS_AUTH_URL=http://ms_auth:3001
      - MS_USUARIOS_URL=http://ms_usuarios:3003
      - MS_POKEMON_URL=http://ms_pokemon:3002
      - MS_CARGA_API_URL=http://ms_carga_api:8000
      - MS_MONTECARLO_URL=http://ms_montecarlo:8010
      - MS_ASISTENCIA_URL=http://ms_asistencia:8005
    depends_on:
      - ms_auth
      - ms_usuarios
      - ms_pokemon
    networks:
      - equiporocket-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./Frontend_EquipoRocket.pk
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Frontend ONLY needs the gateway URL
      VITE_API_URL: http://api_gateway:8000
    depends_on:
      - api_gateway
    networks:
      - equiporocket-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  equiporocket-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
