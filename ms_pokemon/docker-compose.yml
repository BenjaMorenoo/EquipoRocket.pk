version: '3.8'
services:
  ms_pokemon:
    build: .
    image: benjamorenoo/ms_pokemon:latest
    container_name: ms_pokemon
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=example
      - DB_NAME=equiporocketDb
      - PORT=3002
    ports:
      - "3002:3002"
    networks:
      - equiporocket-net
    restart: unless-stopped

networks:
  equiporocket-net:
    external: true
